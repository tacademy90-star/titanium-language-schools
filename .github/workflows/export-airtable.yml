name: Export Airtable language schools

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: airtable-language-schools-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Airtable records
        env:
          AIRTABLE_TOKEN: ${{ secrets.ENGLISH_CENTERS }}
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID || 'appUILlDDRhVQl7G0' }}
          AIRTABLE_TABLE_ID: ${{ vars.AIRTABLE_TABLE_ID || 'tbl5BIWKSzPXBnd16' }}
          AIRTABLE_VIEW_ID: ${{ vars.AIRTABLE_VIEW_ID || 'viwTRsQ5fSUMz2FzF' }}
        run: python scripts/export_airtable.py

      - name: Commit changed data
        run: |
          git add data/english-schools.json
          if git diff --cached --quiet; then
            echo "No Airtable changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-export language schools from Airtable"
          git push
